name: ZainX CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend CI (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Solution
        run: dotnet restore Workforce.slnx

      - name: Build Solution
        run: dotnet build Workforce.slnx --no-restore --configuration Release

      - name: Run Architecture & Unit Tests
        run: dotnet test Workforce.slnx --no-build --configuration Release

  frontend:
    name: Frontend CI (Nx / pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & pnpm
        run: corepack enable pnpm

      - name: Install Frontend Dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: web
        run: pnpm exec eslint .

      - name: Run TypeScript Typecheck
        working-directory: web
        run: pnpm exec tsc --noEmit -p apps/workforce-web/tsconfig.app.json

      - name: Run Unit Tests (Vitest)
        working-directory: web
        run: pnpm exec vitest run

      - name: Build Applications with Nx
        working-directory: web
        run: |
          pnpm exec nx build workforce-web
          pnpm exec nx build design-system-docs

      - name: Build Storybook Documentation
        working-directory: web
        run: pnpm exec storybook build --config-dir apps/design-system-docs/.storybook -o dist/storybook/design-system-docs
